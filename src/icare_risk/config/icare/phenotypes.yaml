# ------------------------------------------------------
#                     SIRS Score
# ------------------------------------------------------

# --8<-- [start:sirs_tachycardia_score_rule]
# Example 1: Boolean AND (HR > 100 AND RR > 22)
sirs_tachycardia_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals' ]
  kwargs:
    logic: 'and'
    components:
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '13472364' ] # HR Code
        rules: [ { expr: "value > 100", points: 1 } ]
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '9096706' ] # RR Code
        rules: [ { expr: "value > 22", points: 1 } ]
# --8<-- [end:sirs_tachycardia_score_rule]

# --8<-- [start:sirs_tachypnea_score_rule]
sirs_tachypnea_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals', 'pathology' ]
  kwargs:
    logic: 'or'
    components:
      # Condition A: High Respiratory Rate in Vitals
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '9096706' ] # Respiratory Rate Code
        rules:
          - expr: "value > 20"
            points: 1
      # Condition B: Low pCO2 in Pathology (optional fallback)
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'PCO2_01' ] # pCO2 Code
        rules:
          - expr: "value < 32"
            points: 1
# --8<-- [end:sirs_tachypnea_score_rule]

# --8<-- [start:sirs_abnormal_temp_score_rule]
sirs_abnormal_temp_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_score_from_rules'
  domains: [ 'vitals' ]
  kwargs:
    domain: 'vitals'
    codes: [ '10933766', '486347689' ] # Temperature Codes (Fever / Hypothermia)
    window: [ "0h", "24h" ]
    rules:
      - expr: "value > 38 or value < 36"
        points: 1
# --8<-- [end:sirs_abnormal_temp_score_rule]

# --8<-- [start:sirs_abnormal_wbc_score_rule]
sirs_abnormal_wbc_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'pathology' ]
  kwargs:
    logic: 'max'
    components:
      # Condition A: WBC Leukocytosis (>12) or Leukopenia (<4)
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'wbc' ]
        rules:
          - expr: "value > 12 or value < 4"
            points: 1
      # Condition B: Bandemia (>10%)
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'bands' ]
        rules:
          - expr: "value > 10"
            points: 1
# --8<-- [end:sirs_abnormal_wbc_score_rule]

# --8<-- [start:sirs_total_score_rule]
# Example 2: Cross-Domain SUM (SIRS Components)
sirs_total_score:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals', 'pathology' ]
  kwargs:
    logic: 'sum'
    components:
      # 1. Tachycardia (HR > 90)
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '13472364' ]
        rules: [ { expr: "value > 90", points: 1 } ]

      # 2. Tachypnea (RR > 20 or pCO2 < 32) -> handled via max sub-logic or individual rules
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '9096705' ]
        rules: [ { expr: "value > 20", points: 1 } ]

      # 3. Abnormal Temperature (> 38 or < 36)
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '10933766', '486347689' ]
        rules: [ { expr: "value > 38 or value < 36", points: 1 } ]

      # 4. Abnormal WBC or Bandemia
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'wbc' ]
        rules: [ { expr: "value > 12 or value < 4", points: 1 } ]
# --8<-- [end:sirs_total_score_rule]

sirs_tachycardia_flag:
  enabled: false
