# ------------------------------------------------------
#                     SIRS Score
# ------------------------------------------------------

# --8<-- [start:sirs_tachycardia_score_rule]
# Example 1: Boolean AND (HR > 100 AND RR > 22)
sirs_tachycardia_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals' ]
  kwargs:
    logic: 'and'
    components:
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '13472364' ] # HR Code
        rules: [ { expr: "value > 100", points: 1 } ]
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '9096706' ] # RR Code
        rules: [ { expr: "value > 22", points: 1 } ]
# --8<-- [end:sirs_tachycardia_score_rule]

# --8<-- [start:sirs_tachypnea_score_rule]
sirs_tachypnea_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals', 'pathology' ]
  kwargs:
    logic: 'or'
    components:
      # Condition A: High Respiratory Rate in Vitals
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '9096706' ] # Respiratory Rate Code
        rules:
          - expr: "value > 20"
            points: 1
      # Condition B: Low pCO2 in Pathology (optional fallback)
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'PCO2_01' ] # pCO2 Code
        rules:
          - expr: "value < 32"
            points: 1
# --8<-- [end:sirs_tachypnea_score_rule]

# --8<-- [start:sirs_abnormal_temp_score_rule]
sirs_abnormal_temp_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_score_from_rules'
  domains: [ 'vitals' ]
  kwargs:
    domain: 'vitals'
    codes: [ '10933766', '486347689' ] # Temperature Codes (Fever / Hypothermia)
    window: [ "0h", "24h" ]
    rules:
      - expr: "value > 38 or value < 36"
        points: 1
# --8<-- [end:sirs_abnormal_temp_score_rule]

# --8<-- [start:sirs_abnormal_wbc_score_rule]
sirs_abnormal_wbc_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'pathology' ]
  kwargs:
    logic: 'max'
    components:
      # Condition A: WBC Leukocytosis (>12) or Leukopenia (<4)
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'wbc' ]
        rules:
          - expr: "value > 12 or value < 4"
            points: 1
      # Condition B: Bandemia (>10%)
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'bands' ]
        rules:
          - expr: "value > 10"
            points: 1
# --8<-- [end:sirs_abnormal_wbc_score_rule]

# --8<-- [start:sirs_total_score_rule]
# Example 2: Cross-Domain SUM (SIRS Components)
sirs_total_score:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals', 'pathology' ]
  kwargs:
    logic: 'sum'
    components:
      # 1. Tachycardia (HR > 90)
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '13472364' ]
        rules: [ { expr: "value > 90", points: 1 } ]

      # 2. Tachypnea (RR > 20 or pCO2 < 32) -> handled via max sub-logic or individual rules
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '9096705' ]
        rules: [ { expr: "value > 20", points: 1 } ]

      # 3. Abnormal Temperature (> 38 or < 36)
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '10933766', '486347689' ]
        rules: [ { expr: "value > 38 or value < 36", points: 1 } ]

      # 4. Abnormal WBC or Bandemia
      - extractor_type: 'rules'
        domain: 'pathology'
        codes: [ 'wbc' ]
        rules: [ { expr: "value > 12 or value < 4", points: 1 } ]
# --8<-- [end:sirs_total_score_rule]

sirs_tachycardia_flag:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_from_expression'
  domains: ['vitals']
  kwargs:
    codes: ['13472364'] # Heart Rate
    query_expr: 'value > 90.0'

sirs_tachypnea_flag:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.sirs'
  function: 'derive_sirs_tachypnea'
  domains: ['vitals', 'pathology']
  kwargs:
    window: ['0h', '24h']
    rr_codes: ['9096705'] # Respiratory Rate
    pco2_codes: ['PCO2_01'] # pCO2 codes (optional, leave empty list to ignore)

sirs_abnormal_temp_flag:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.sirs'
  function: 'derive_sirs_abnormal_temp'
  domains: ['vitals']
  kwargs:
    window: ['0h', '24h']
    codes: ['10933766', '486347689']

sirs_abnormal_wbc_flag:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.sirs'
  function: 'derive_sirs_abnormal_wbc'
  domains: ['pathology']
  kwargs:
    window: ['0h', '24h']
    wbc_codes: ['wbc']
    bands_codes: ['bands']
    wbc_high: 12.0
    wbc_low: 4.0
    bands_thresh: 10.0


# ------------------------------------------------------
#               Pitt Bacteremia Score
# ------------------------------------------------------

# Notes:
# 1. Careful with code 486347689 because its name is 'high temperature or fever?' so
#    it might not be a number but a boolean flag? Double check in iCare.

# ----------------------------------
# Combo rules configurable from yaml
# ----------------------------------
# These phenotypes evaluate each clinical condition against the configured rules
# to produce a binary indicator (0 or 1), which is then multiplied by the assigned
# point weighting to compute and return the final score.

# --8<-- [start:pitt_fever_score_rule]
pitt_fever_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_score_from_rules'
  domains: [ 'vitals' ]
  kwargs:
    domain: 'vitals'
    codes: [ '10933766', '486347689' ]
    window: [ "0h", "24h" ]
    rules:
      - expr: "value <= 35.0 or value >= 40.0"
        points: 2
      - expr: "35.1 <= value <= 36.0"
        points: 1
      - expr: "39.0 <= value <= 39.9"
        points: 1
# --8<-- [end:pitt_fever_score_rule]

# --8<-- [start:pitt_mental_score_rule]
pitt_mental_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_score_from_rules'
  domains: [ 'vitals' ]
  kwargs:
    domain: 'vitals'
    codes: [ '9097010', '9268392' ]
    window: [ "0h", "24h" ]
    rules:
      - expr: "value <= 9"
        points: 4
      - expr: "10 <= value <= 12"
        points: 2
      - expr: "13 <= value <= 14"
        points: 1
# --8<-- [end:pitt_mental_score_rule]

# --8<-- [start:pitt_hypo_score_rule]
pitt_hypo_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals', 'prescribing' ]
  kwargs:
    logic: 'max'
    components:
      # Component A: Systolic Blood Pressure < 90
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '13389125' ] # SBP universal code
        rules:
          - expr: "value < 90.0"
            points: 2

      # Component B: Vasopressor Administration (has vasopressors)
      - extractor_type: 'keyword'
        domain: 'prescribing'
        #text_col: 'code'
        keywords:
          - 'noradrenaline'
          - 'norepinephrine'
          - 'epinephrine'
          - 'dopamine'
          - 'vasopressin'
          - 'dobutamine'
          # - 'propofol' ## !!!!! JUST FOR TESTING REMOVE!
        points: 2  # Custom scaling factor for the boolean res
# --8<-- [end:pitt_hypo_score_rule]

# --8<-- [start:pitt_vent_score_rule]
pitt_vent_score_rule:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals' ]
  kwargs:
    logic: 'max'
    components:

      # Option A: Captured as a flowsheet keyword in vitals / observations
      - extractor_type: 'keyword'
        domain: 'vitals'
        text_col: 'value'
        keywords: [ 'mechanical ventilation', 'tracheostomy', 'invasive vent', 'ventilator' ]
        check_current: true
        window: [ "0h", "24h" ]
        points: 2

      # Option B: Captured as an acute procedure / diagnosis code during the stay
      - extractor_type: 'history'
        target_domains: [ 'diagnoses' ]
        codes: [ 'Z99.11', 'E85.1' ] # ICD-10 dependence on ventilator / OPCS invasive ventilation
        include_current: true
        window: [ "0h", "24h" ]
        points: 2
# --8<-- [end:pitt_vent_score_rule]

# --8<-- [start:pitt_arrest_score_rule]
pitt_arrest_score_rule:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals' ]
  kwargs:
    logic: 'max'
    components:
      - extractor_type: 'history'
        domain: 'diagnoses'
        codes:
          - 'I46'       # ICD-10 Cardiac arrest
          - 'I46.9'     # Cardiac arrest, unspecified
          - '410429000' # SNOMED Cardiac arrest
          - '89666000'  # SNOMED Cardiopulmonary arrest
        points: 4
# --8<-- [end:pitt_arrest_score_rule]

# ---------------------------------------------------------
# Call an specific python function which computes the score
# ---------------------------------------------------------
pitt_fever_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_fever_score'
  domains: ['vitals']
  kwargs:
    window: ['0h', '24h'] # ['0h', '24h'] / null
    codes: ['10933766', '486347689']

pitt_mental_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_mental_score'
  domains: ['vitals']
  kwargs:
    window: ['0h', '24h']
    codes: ['9097010', '9268392']

pitt_hypo_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_hypo_score'
  domains: ['vitals'] #, 'prescribing']
  kwargs:
    window: ['0h', '24h']
    sbp_codes: ['13389125']
    vasopressor_drugs:
      - 'NOREPINEPHRINE'
      - 'EPINEPHRINE'
      - 'VASOPRESSIN'

pitt_vent_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_vent_score'
  domains: [] #['interventions']
  kwargs:
    window: ['0h', '24h']
    codes: ['MECH_VENT_01']

pitt_arrest_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_arrest_score'
  domains: [] #['interventions']
  kwargs:
    window: ['0h', '24h']
    codes: ['CARDIAC_ARREST_01']

pitt_bacteremia_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_score'
  domains: [ 'vitals' ] #  'prescribing', 'interventions'
  kwargs:
    window: [ '0h', '24h' ]
    fever_codes: [ '10933766', '486347689' ]
    gcs_codes: [ '9268392' ]
    sbp_codes: [ '13389125' ]
    vasopressor_drugs:
      - 'NOREPINEPHRINE'
      - 'EPINEPHRINE'
      - 'VASOPRESSIN'
      - 'DOPAMINE'
    vent_codes: [ 'MECH_VENT_01' ]
    arrest_codes: [ 'CARDIAC_ARREST_01' ]


