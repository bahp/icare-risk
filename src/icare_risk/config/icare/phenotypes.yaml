
# -------------------------------------------------------------------
# Definitions
# -------------------------------------------------------------------
definitions:
  concepts:
    # ------------------ VITALS ------------------
    heart_rate:
      icare: &hr_icare ['13472364']
    systolic_bp:
      icare: &sbp_icare ['13389125']
    diastolic_bp:
      icare: &dbp_icare ['13389131']
    mean_arterial_pressure:
      icare: &map_icare ['10933808']
    respiratory_rate:
      icare: &rr_icare ['9096706']
    spo2:
      icare: &spo2_icare ['9111827']
    temperature:
      icare: &temp_icare ['10933766', '49093394']
    gcs:
      icare: &gcs_icare ['9097010']
    conscious_level:
      icare: &avpu_icare ['12761333']

    # ------------------ LABS --------------------
    glucose:
      icare: &gluc_icare
        - 'wg'
        - 'gl'
        - 'glpoc'
    wbc:
      icare: &wbc_icare
        - 'Lwbc'
    bilirubin:
      icare: &bili_icare
        - 'bil'

    congestive_heart_failure:
      snomed: &chf_snomed
        - '446221000'
        - '703273002'
        - '84114007'
      icd10: &chf_icd10
        - 'I50'
        - 'I11.0'
      icare: &chf_icare ['446221000', '703273002', '42343007', '390884006', '161505003',
                         '84114007', '424404003', '128404006', '703272007', '446221000',
                         '418304008', '446221000', '10633002', '48447003', '703272007' ]
      drugs: &chf_drugs
        - 'entresto'
        - 'milrinone'
        - 'dobutamine'


# ------------------------------------------------------
# Basic Examples / Testing
# ------------------------------------------------------
min_spo2_24h:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.windowed'
  function: 'min_spo2_24h'
  domains: ['vitals']
  kwargs:
    code: '9096705'
    window: ['0h', '24h']

min_temp_24h:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.windowed'
  function: 'min_temp_24h'
  domains: ['vitals']
  kwargs:
    code: '10933766'
    window: ['0h', '24h']

has_vasopressors:   # has_medication_in_window
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.multimodal' # Wrong to deprecate
  function: 'derive_multimodal_phenotype'
  domains: [ 'problems', 'prescribing', 'pathology' ]
  category: [ 'multimodal' ]
  kwargs:
    keyword_rules:
      # Medication history proxy matching free text
      - domain: 'prescribing'
        keywords:
          - 'norepinephrine'
          - 'epinephrine'
          - 'vasopressin'
          - 'dopamine'
          - 'dobutamine'
          - 'phenylephrine'
          - 'noradrenaline'
          - 'angiotensin'
        #text_col: 'code'
        check_historical: true

# --8<-- [start:has_diabetes]
has_diabetes:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.multimodal'
  function: 'derive_multimodal_phenotype'
  domains: [ 'problems', 'prescribing', 'pathology' ]
  category: [ 'multimodal' ]
  kwargs:
    code_rules:
      # Historical problem list entries
      - target_domains: [ 'problems' ]
        codes: [ '44054006', '73211009', '46635009' ]
        include_current: false

      # Current admission diagnoses (ICD-10)
      - target_domains: [ 'diagnoses' ]
        codes: [ 'E10', 'E11', 'E14' ]
        include_current: true
        window: [ '0h', '24h' ]

    keyword_rules:
      # Medication history proxy matching free text
      - domain: 'prescribing'
        keywords: [ 'insulin', 'metformin', 'gliclazide' ]
        #text_col: 'code'
        check_historical: true

    expression_rules:
      # Point-of-care or lab glucose threshold
      - domain: 'pathology'
        codes: [ 'wg', 'gl', 'glpoc' ]
        query_expr: 'value > 200'
        value_col: 'value'
        #code_col: 'code'
        check_current: true
        window: [ '0h', '24h' ]
# --8<-- [end:has_diabetes]

has_congestive_heart_failure:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.multimodal'
  function: 'derive_multimodal_phenotype'
  domains: [ 'problems', 'prescribing' ]
  category: [ 'multimodal' ]
  kwargs:
    code_rules:
      # Historical problem list entries
      - target_domains: [ 'problems' ]
        codes: *chf_icare
        include_current: false

    keyword_rules:
      # Medication history proxy matching free text
      - domain: 'prescribing'
        keywords: [ 'entresto', 'milrinone', 'dobutamine' ]
        #text_col: 'code'
        check_current: true

# --8<-- [start:has_mild_liver_disease]
has_mild_liver_disease:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.multimodal'
  function: 'derive_multimodal_phenotype'
  domains: [ 'problems', 'prescribing', 'pathology' ]
  category: [ 'multimodal' ]
  kwargs:
    code_rules:
      # Historical problem list entries
      - target_domains: [ 'problems' ]
        codes: [
          '61977001', '111891008', '768126006', '128302006', '442685003', '62944002', '9953008']
        include_current: false

    keyword_rules:
      # Medication history proxy matching free text
      - domain: 'prescribing'
        keywords: [ 'lactulose' ]
        #text_col: 'code'
        check_current: true

    expression_rules:
      # AST or bilirubin thresholds
      - domain: 'pathology'
        codes: [ 'bil' ] # Bilirubin
        query_expr: 'value > 2.0'
        value_col: 'value'
        #code_col: 'code'
        check_current: true
        window: [ '0h', '24h' ]

      # To add... AST > 3x normal?
# --8<-- [end:has_mild_liver_disease]



