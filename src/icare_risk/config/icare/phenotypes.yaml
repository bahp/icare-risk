  function: 'derive_composite_rules'
  category: ['kim_components']
  kwargs:
    logic: 'or'
    components:
      - extractor_type: 'keyword'
        domain: 'prescribing'
        text_col: 'THERAPEUTICAL_CLASS'
        keywords: ['antibiotics', 'antibacterials']
        window: [ '-2160h', '0h' ]
