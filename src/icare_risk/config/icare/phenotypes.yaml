# ------------------------------------------------------
# Charlson Comorbidity Index (CCI)
# ------------------------------------------------------
# --- 1 Point Categories ---
# --8<-- [start:charlson_hx_mi]
# Myocardial Infarction
charlson_hx_mi:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  category: ['charlson_components']
  kwargs:
    logic: 'max'
    components:
      - extractor_type: 'history'
        domain: 'problems'
        codes: *mi_snomed
      - extractor_type: 'history'
        domain: 'problems'
        codes: *mi_res195
# --8<-- [end:charlson_hx_mi]

# --8<-- [start:charlson_hx_chf]
# Congestive Heart Failure
charlson_hx_chf:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  category: ['charlson_components']
  domains: [ 'problems', 'prescribing' ]
  kwargs:
    logic: 'max'
    components:
      - extractor_type: 'history'
        domain: 'problems'
        codes: *chf_snomed
      - extractor_type: 'history'
        domain: 'problems'
        codes: *chf_res195
      - extractor_type: 'keyword'
        domain: 'prescribing'
        window: [null, '24h']
        keywords:
          - 'entresto'
          - 'milrinone'
          - 'dobutamine'
# --8<-- [end:charlson_hx_chf]

# --8<-- [start:charlson_hx_pvd]
# Peripheral Vascular Disease
charlson_hx_pvd:
