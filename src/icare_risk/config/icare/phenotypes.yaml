# ------------------------------------------------------
#               Pitt Bacteremia Score
# ------------------------------------------------------

# Notes:
# 1. Careful with code 486347689 because its name is 'high temperature or fever?' so
#    it might not be a number but a boolean flag? Double check in iCare.

# ----------------------------------
# Combo rules configurable from yaml
# ----------------------------------
# These phenotypes evaluate each clinical condition against the configured rules
# to produce a binary indicator (0 or 1), which is then multiplied by the assigned
# point weighting to compute and return the final score.

# --8<-- [start:pitt_fever_score_rule]
pitt_fever_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_score_from_rules'
  domains: [ 'vitals' ]
  kwargs:
    domain: 'vitals'
    codes: [ '10933766', '486347689' ]
    window: [ "0h", "24h" ]
    rules:
      - expr: "value <= 35.0 or value >= 40.0"
        points: 2
      - expr: "35.1 <= value <= 36.0"
        points: 1
      - expr: "39.0 <= value <= 39.9"
        points: 1
# --8<-- [end:pitt_fever_score_rule]

# --8<-- [start:pitt_mental_score_rule]
pitt_mental_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_score_from_rules'
  domains: [ 'vitals' ]
  kwargs:
    domain: 'vitals'
    codes: [ '9097010', '9268392' ]
    window: [ "0h", "24h" ]
    rules:
      - expr: "value <= 9"
        points: 4
      - expr: "10 <= value <= 12"
        points: 2
      - expr: "13 <= value <= 14"
        points: 1
# --8<-- [end:pitt_mental_score_rule]

# --8<-- [start:pitt_hypo_score_rule]
pitt_hypo_score_rule:
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals', 'prescribing' ]
  kwargs:
    logic: 'max'
    components:
      # Component A: Systolic Blood Pressure < 90
      - extractor_type: 'rules'
        domain: 'vitals'
        codes: [ '13389125' ] # SBP universal code
        rules:
          - expr: "value < 90.0"
            points: 2

      # Component B: Vasopressor Administration (has vasopressors)
      - extractor_type: 'keyword'
        domain: 'prescribing'
        #text_col: 'code'
        keywords:
          - 'noradrenaline'
          - 'norepinephrine'
          - 'epinephrine'
          - 'dopamine'
          - 'vasopressin'
          - 'dobutamine'
          # - 'propofol' ## !!!!! JUST FOR TESTING REMOVE!
        points: 2  # Custom scaling factor for the boolean res
# --8<-- [end:pitt_hypo_score_rule]

# --8<-- [start:pitt_vent_score_rule]
pitt_vent_score_rule:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals' ]
  kwargs:
    logic: 'max'
    components:

      # Option A: Captured as a flowsheet keyword in vitals / observations
      - extractor_type: 'keyword'
        domain: 'vitals'
        text_col: 'value'
        keywords: [ 'mechanical ventilation', 'tracheostomy', 'invasive vent', 'ventilator' ]
        check_current: true
        window: [ "0h", "24h" ]
        points: 2

      # Option B: Captured as an acute procedure / diagnosis code during the stay
      - extractor_type: 'history'
        target_domains: [ 'diagnoses' ]
        codes: [ 'Z99.11', 'E85.1' ] # ICD-10 dependence on ventilator / OPCS invasive ventilation
        include_current: true
        window: [ "0h", "24h" ]
        points: 2
# --8<-- [end:pitt_vent_score_rule]

# --8<-- [start:pitt_arrest_score_rule]
pitt_arrest_score_rule:
  enabled: false
  module: 'icare_risk.clinphen.phenotypes.utils'
  function: 'derive_composite_rules'
  domains: [ 'vitals' ]
  kwargs:
    logic: 'max'
    components:
      - extractor_type: 'history'
        domain: 'diagnoses'
        codes:
          - 'I46'       # ICD-10 Cardiac arrest
          - 'I46.9'     # Cardiac arrest, unspecified
          - '410429000' # SNOMED Cardiac arrest
          - '89666000'  # SNOMED Cardiopulmonary arrest
        points: 4
# --8<-- [end:pitt_arrest_score_rule]

# ---------------------------------------------------------
# Call an specific python function which computes the score
# ---------------------------------------------------------
pitt_fever_score:
  module: 'icare_risk.clinphen.phenotypes.pitt'
  function: 'compute_pitt_fever_score'
