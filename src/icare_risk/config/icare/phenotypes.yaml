          - 'piperacillin'
          - 'meropenem'
          - 'ceftriaxone'
          - 'ciprofloxacin'
          - 'ceftazidime'
          - 'cefepime'
        window: ['-2160h', '24h']
      - extractor_type: 'keyword'
        domain: 'prescribing'
        text_col: 'THERAPEUTICAL_CLASS'
        keywords: ['antibiotics', 'antibacterials']
        window: ['-2160h', '24h']

