episodes:
  #source: "/app/data/mock/sirs_test/episodes.parquet"
  source: "/app/notebooks/data/synthetic/10000p/icare_episodes_anon.parquet"
  subject: "SUBJECT"
  encounter: "ENCNTR_ID"
  admission_date: "ADMISSION_DATE"
  admission_time: "ADMISSION_TIME"
  discharge_date: "DISCHARGE_DATE"
  spell: null

domains:
  problems:
    source: "/app/notebooks/data/synthetic/10000p/icare_problems_anon.parquet"
    subject: "SUBJECT"
    timestamp: "PROBLEM_DT_TM"
    mapping:
      code: "PROBLEM_CODE"
      description: "PROBLEM_DESC"

  diagnosis:
    source: "/app/notebooks/data/synthetic/10000p/icare_episodes_diagnosis_anon.parquet"
    subject: "SUBJECT"
    timestamp: "DIAGNOSIS_DATE"
    mapping:
      code: "DIAGNOSIS_CODE_ICD"
      name: "DIAGNOSIS_DESC_ICD"
      DIAGNOSIS_CODE_ICD: "DIAGNOSIS_CODE_ICD"
      DIAGNOSIS_DESC_ICD: "DIAGNOSIS_DESC_ICD"
      DIAGNOSIS_CODE_SNOMED: "DIAGNOSIS_CODE_SNOMED"
      DIAGNOSIS_DESC_SNOMED: "DIAGNOSIS_DESC_SNOMED"


  vitals:
    #source: "/app/data/mock/sirs_test/vitals.parquet"
    source: "/app/notebooks/data/synthetic/10000p/icare_vital_signs_anon.parquet"
    subject: "SUBJECT"
    timestamp: "OBSERVATION_PERFORMED_DT"
    mapping:
      code: "OBSERVATION_CODE"
      value: "OBSERVATION_RESULT_CLEAN"
      name: "OBSERVATION_NAME" # Remove to speed up?
      unit: "OBSERVATION_UNIT" # Remove to speed up?

  pathology:
    #source: "/app/data/mock/sirs_test/pathology.parquet"
    source: "/app/notebooks/data/synthetic/10000p/icare_pathology_blood_anon.parquet"
    subject: "SUBJECT"
    timestamp: "SAMPLE_COLLECTED_DT"
    mapping:
      code: "TEST_CODE"
      value: "RESULT_CLEANED"

  prescribing:
    source: "/app/notebooks/data/synthetic/10000p/icare_pharmacy_prescribing_anon.parquet"
    subject: "SUBJECT"
    timestamp: "ORDER_DT_TM"
    mapping:
      code: "MEDICATION_NAME_SHORT"
      name: "MEDICATION_NAME_SHORT"
      value: "ORDERED_DOSE"
      THERAPEUTICAL_CLASS: "THERAPEUTICAL_CLASS"
      #MEDICATION_NAME: "MEDICATION_NAME"

  microbiology:
    source: "/app/notebooks/data/synthetic/10000p/icare_microbiology_anon.parquet"
    subject: "SUBJECT"
    timestamp: "LATEST_COLLECT_DT"
    mapping:
      site: "site"
      code: "order_code"
      name: "order_name"
      value: "organism_bug"
      organism: "organism_bug"
      sensitivity: "sensitivity"

