# config/multi_code_search.yaml
targets:

  # --------------------------------------------------
  # Looking for problems based on ICD10 codes
  # --------------------------------------------------
  # Target 1: The ICD-10 File
  - file: "ICD10.csv"
    code_col: "Code"
    search_cols: ["Description", "Detail"] # Searches both columns
    export_cols: [ ]
    campaigns: &charlson_campaigns
      - category: "Myocardial Infarction"
        contains: [ "myocardial infarction", "heart attack", "stemi", "nstemi" ]

        exclude: [ "old", "history of", "family history" ]

      - category: "Congestive Heart Failure"
        contains: [ "heart failure", "chf", "cardiac failure", "ventricular failure" ]
        exclude: [ "family history" ]

      - category: "Peripheral Vascular Disease"
        contains: [ "peripheral vascular", "pvd", "claudication", "gangrene", "peripheral artery", "aortic aneurysm" ]
        exclude: [ "family history" ]

      - category: "Cerebrovascular Disease"
        contains: [ "stroke", "cerebrovascular", "cva", "transient ischemic attack", "tia", "cerebral infarction", "intracerebral hemorrhage" ]
        exclude: [ "history of", "old", "family history" ]

      - category: "Dementia"
        contains: [ "dementia", "alzheimer", "senile" ]
        exclude: [ "family history" ]

      - category: "Chronic Pulmonary Disease"
        contains: [ "pulmonary disease", "copd", "emphysema", "chronic bronchitis", "asthma", "bronchiectasis" ]
        exclude: [ "acute" ]

      - category: "Rheumatic Disease"
        contains: [ "rheumatoid", "lupus", "sle", "scleroderma", "polymyositis", "connective tissue" ]
        exclude: [ "rheumatic fever" ]

      - category: "Peptic Ulcer Disease"
        contains: [ "peptic ulcer", "gastric ulcer", "duodenal ulcer" ]
        exclude: [ "history of" ]

      - category: "Mild Liver Disease"
        contains: [ "chronic hepatitis", "cirrhosis", "liver disease", "hepatic steatosis" ]
        exclude: [ "coma", "ascites", "varices", "failure", "severe" ]

      - category: "Diabetes Uncomplicated"
        contains: [ "diabetes", "diabetic" ]
        exclude: [ "complication", "retinopathy", "neuropathy", "nephropathy", "ketoacidosis", "coma" ]

      - category: "Hemiplegia or Paraplegia"
        contains: [ "hemiplegia", "paraplegia", "paraparesis", "hemiparesis", "tetraplegia" ]
        exclude: [ "sleep paralysis" ]

      - category: "Renal Disease Moderate to Severe"
        contains: [ "chronic kidney", "ckd", "renal failure", "end stage renal", "esrd", "dialysis", "nephropathy", "uremia" ]
        exclude: [ "stone", "calculus", "mild" ]

      - category: "Diabetes Complicated"
        contains: [ "diabetic retinopathy", "diabetic neuropathy", "diabetic nephropathy", "diabetes with complication", "diabetic ketoacidosis" ]
        exclude: [ ]

      - category: "Solid Tumor"
        contains: [ "malignant neoplasm", "carcinoma", "tumor", "cancer" ]
        exclude: [ "metastatic", "secondary", "leukemia", "lymphoma", "benign", "history of" ]

      - category: "Leukemia"
        contains: [ "leukemia", "leukaemia" ]
        exclude: [ "history of" ]

      - category: "Lymphoma"
        contains: [ "lymphoma", "hodgkin" ]
        exclude: [ "history of" ]

      - category: "Moderate to Severe Liver Disease"
        contains: [ "hepatic coma", "liver cirrhosis with ascites", "esophageal varices", "hepatic failure" ]
        exclude: [ ]

      - category: "Metastatic Solid Tumor"
        contains: [ "metastatic", "metastasis", "secondary malignant", "secondary carcinoma" ]
        exclude: [ ]

      - category: "AIDS"
        contains: [ "aids", "acquired immune deficiency" ]
        exclude: [ "without aids" ]

      - category: "HIV"
        contains: [ "hiv", "human immunodeficiency virus" ]
        exclude: [ "aids", "acquired immune deficiency" ]

      - category: "ESBL"
        contains:
          - "esbl"
          - "extended spectrum beta"
          - "extended-spectrum beta"
          - "beta lactamase"
          - "beta-lactamase"
        exclude: [ ]

      - category: "CPE / Carbapenem Resistance"
        contains:
          - "carbapenem"
          - "cpe"
        exclude: [ ]

      - category: "MRSA"
        contains:
          - "mrsa"
          - "methicillin resistant"
          - "methicillin-resistant"
        exclude: [ ]

      - category: "Urinary Catheter"
        contains:
          - "urinary catheter"
          - "foley"
          - "indwelling catheter"
          - "suprapubic catheter"
          - "catheterization of bladder"
        exclude:
          - "removal"
          - "complication"

      - category: "Nursing Home / Long-Term Care"
        contains:
          - "nursing home"
          - "care home"
          - "residential care"
          - "long term care"
          - "long-term care"
          - "nursing facility"
          - "skilled nursing"
          - "snf"
          - "assisted living"
          - "rest home"
          - "residential home"
        exclude:
          - "day care"
          - "child care"
          - "foster home"
          - "family history"
          - "home care"

      - category: "Chronic Dialysis"
        contains:
          - "dialysis"
          - "hemodialysis"
          - "haemodialysis"
          - "peritoneal dialysis"
          - "end stage renal"
          - "esrd"
          - "renal replacement"
          - "av fistula"
          - "arteriovenous fistula"
          - "av graft"
        exclude:
          - "acute"
          - "temporary"
          - "family history"

      - category: "Antibiotic Exposure / Prior Antibiotics"
        contains:
          - "antibiotic"
          - "antibiotics"
          - "antibacterial"
          - "antibacterials"
          - "antimicrobial"
          - "antimicrobials"
          - "antibiotic therapy"
          - "antibiotic use"
          - "prior antibiotic"
          - "previous antibiotic"
        exclude:
          - "allergy"
          - "allergic"
          - "hypersensitivity"
          - "adverse"
          - "intolerance"
          - "reaction"
          - "family history"
          - "refusal"
          - "contraindication"

      - category: "Recent Hospital Admission"
        contains:
          - "hospital admission"
          - "hospitalized"
          - "hospitalised"
          - "hospitalization"
          - "hospitalisation"
          - "inpatient stay"
          - "inpatient admission"
          - "recent admission"
          - "previous admission"
          - "prior admission"
          - "hospital readmission"
          - "readmitted"
        exclude:
          - "family history"
          - "outpatient"
          - "day case"
          - "day surgery"
          - "refusal"

  # --------------------------------------------------
  # Looking for problems based on ICD10 codes
  # --------------------------------------------------
  # Target 2: The SNOMED File
  - file: "snomed.csv"
    code_col: "concept_id"
    search_cols: ["term"] # Just one column
    campaigns:
      - category: "SNOMED10 - Dementia"
        contains: ["dementia", "alzheimer", "senile"]
        exclude: ["family history"]


  # ------------------------------------------------
  # Looking for comorbidities in res195.csv
  # ------------------------------------------------
  - file: "res195.csv"
    code_col: "code"
    search_cols: [ "description" ] # Searches across three columns
    export_cols: [ ]
    campaigns: *charlson_campaigns


  # --------------------------------------------------
  # Looking for comorbidities in icarePRO.csv
  # --------------------------------------------------
  - file: "icarePRO.csv"
    code_col: "code"
    search_cols: [ "name" ]
    export_cols: [ ]
    campaigns: *charlson_campaigns