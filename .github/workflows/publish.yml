name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # <--- Action triggers ONLY when a tag starting with 'v' is pushed

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write  # <--- This is required for tokenless publishing

    steps:
      - name: Checkout code
        # Fetch all history and tags for setuptools_scm to work
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Debug workspace structure
        run: |
          echo "Current working directory:"
          pwd
          echo "Files in root:"
          ls -la
          echo "Checking inside notebooks/ if it exists:"
          ls -la notebooks/ || echo "notebooks folder not found in root"

      - name: Sync selected notebooks into package source
        run: |
          dest=src/icare_risk/notebooks
          rm -rf "$dest" && mkdir -p "$dest"

          echo "Copying notebooks from source..."
          for folder in a_download b_preparation c_analysis d_tutorials; do
            mkdir -p "$dest/$folder"
            cp -r notebooks/$folder/*.ipynb "$dest/$folder/" 2>/dev/null || true
          done

          find notebooks -maxdepth 1 -type f -name '*.ipynb' -exec cp {} "$dest/" \;
          
          echo "--- Verification: Listing files packed into $dest ---"
          find "$dest" -type f -name "*.ipynb"
          

      - name: Build package (wheel and source distribution)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1