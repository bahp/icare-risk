name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'  # <--- Action triggers ONLY when a tag starting with 'v' is pushed

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write  # <--- This is required for tokenless publishing

    steps:
      - name: Checkout code
        # Fetch all history and tags for setuptools_scm to work
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Sync root notebooks into package
        run: |
          mkdir -p src/icare_risk/notebooks
          cp notebooks/*.ipynb src/icare_risk/notebooks/

      - name: Build package (wheel and source distribution)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1