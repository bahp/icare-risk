sirs_tachycardia_score_rule:
  module: icare_risk.clinphen.phenotypes.utils
  function: derive_composite_rules
  domains:
  - vitals
  kwargs:
    logic: and
    components:
    - extractor_type: rules
      domain: vitals
      codes:
      - '13472364'
      rules:
      - expr: value > 100
        points: 1
    - extractor_type: rules
      domain: vitals
      codes:
      - '9096706'
      rules:
      - expr: value > 22
        points: 1
