sirs_tachypnea_score_rule:
  module: icare_risk.clinphen.phenotypes.utils
  function: derive_composite_rules
  domains:
  - vitals
  - pathology
  kwargs:
    logic: or
    components:
    - extractor_type: rules
      domain: vitals
      codes:
      - '9096706'
      rules:
      - expr: value > 20
        points: 1
    - extractor_type: rules
      domain: pathology
      codes:
      - PCO2_01
      rules:
      - expr: value < 32
        points: 1
