[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "icare-risk"
dynamic = ["version"]
description = "Clinical pipeline package for secure environment deployment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pandas",
    "numpy",
    "PyYAML",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn"
]

[project.optional-dependencies]
# Optional dependencies go here, grouped by a name you choose (e.g., 'docs', 'dev')
docs = [
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python"
]
dev = [
    "pytest",
]
# You can also combine them
all = ["your-package[docs,dev]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["icare_risk", "icare_risk.*"]

[tool.setuptools.package-data]
"icare_risk.config" = ["*.yaml", "tests/fixtures/*.csv"]

[tool.setuptools_scm]
fallback_version = "0.0.0-dev"

[project.scripts]
icare-risk-generate = "icare_risk.scripts.a_generate_data:main"
icare-risk-features = "icare_risk.scripts.b_build_features_icare:main"
icare-risk-evaluate = "icare_risk.scripts.c_evaluate_scores:main"
icare-risk-thresholds = "icare_risk.scripts.d_evaluate_thresholds:main"
icare-risk-validate = "icare_risk.scripts.e_validate_scores:main"
icare-risk-search = "icare_risk.scripts.f_find_clinical_codes:main"